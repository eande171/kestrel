# Kestrel Lichess Bot
services:
  kestrel:
    image: ghcr.io/eande171/kestrel-bot:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./config:/config
    environment:
      LICHESS_BOT_TOKEN_FILE: /run/secrets/lichess_token
    secrets:
      - lichess_token

secrets:
  lichess_token:
    file: ./secrets/lichess_token.txt
