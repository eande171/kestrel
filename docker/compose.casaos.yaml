# Kestrel Bot For CasaOS
name: kestrel
services:
  kestrel:
    image: ghcr.io/eande171/kestrel-bot:latest
    container_name: kestrel
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    cpu_shares: 50
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
        reservations:
          memory: 256M
    volumes:
      - /DATA/AppData/kestrel/config:/config
      - /DATA/AppData/kestrel/secrets/lichess_token.txt:/run/secrets/lichess_token:ro
    environment:
      LICHESS_BOT_TOKEN_FILE: /run/secrets/lichess_token
    x-casaos:
      title:
        en_us: Kestrel
      description:
        en_us: Kestrel chess bot playing on Lichess
