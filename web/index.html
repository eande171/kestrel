<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>chess-ai</title>
    <meta name="description" content="Play chess against a small neural network trained on Lichess games.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="container nav-inner">
            <a class="nav-logo" href="#play">CHESS-AI</a>
        </div>
    </nav>

    <main id="play" class="container play">
        <section class="board-col">
            <div class="player-strip" id="top-strip"></div>
            <div class="board-wrap">
                <div id="board" class="board" aria-label="chess board"></div>
                <div id="promotion" class="promotion" hidden></div>
            </div>
            <div class="player-strip" id="bottom-strip"></div>
        </section>

        <aside class="side-col">
            <div class="panel">
                <div class="section-label">Game</div>
                <div id="status" class="status">Connecting</div>
                <div class="button-row">
                    <button id="undo" class="btn btn-secondary">Undo</button>
                    <button id="flip" class="btn btn-secondary">Flip</button>
                    <button id="resign" class="btn btn-secondary">Resign</button>
                </div>
            </div>

            <div class="panel">
                <div class="section-label">New game</div>
                <div class="field-label">Play as</div>
                <div class="segmented" id="color-choice">
                    <button data-value="white">White</button>
                    <button data-value="random">Random</button>
                    <button data-value="black">Black</button>
                </div>
                <div class="field-label">Strength</div>
                <div class="segmented" id="depth-choice">
                    <button data-value="0" title="Plays its first instinct, no look-ahead">Instinct</button>
                    <button data-value="2" title="Looks 2 moves ahead">Careful</button>
                    <button data-value="3" title="Looks 3 moves ahead">Strong</button>
                </div>
                <button id="new-game" class="btn btn-primary wide">Start new game</button>
            </div>

            <div class="panel moves-panel">
                <div class="panel-head">
                    <div class="section-label">Moves</div>
                    <button id="copy-pgn" class="link-btn">copy PGN</button>
                </div>
                <ol id="moves" class="moves"></ol>
            </div>
        </aside>
    </main>

    <footer>
        <div class="container footer-inner">
            <span id="model-info">chess-ai</span>
            <span>Game data from the Lichess open database (CC0).</span>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
