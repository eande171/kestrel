<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Kestrel</title>
    <meta name="description" content="Play chess against Kestrel, a small neural network that runs entirely in your browser.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../kestrel.svg">
    <link rel="stylesheet" href="../kestrel.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body>

<nav>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <a href="../index.html" class="nav-logo">KESTREL</a>
            <div class="d-flex gap-4">
                <a href="../index.html" class="nav-link-item">about</a>
                <a href="https://lichess.org/@/KestrelChess" class="nav-link-item">lichess</a>
                <a href="https://github.com/eande171/kestrel" class="nav-link-item">github</a>
            </div>
        </div>
    </div>
</nav>

<main id="play" class="container play">
    <section class="board-col" data-aos="fade-up" data-aos-delay="100">
        <div class="player-strip" id="top-strip"></div>
        <div class="board-wrap">
            <div id="board" class="board" aria-label="chess board"></div>
            <div id="promotion" class="promotion" hidden></div>
        </div>
        <div class="player-strip" id="bottom-strip"></div>
    </section>

    <aside class="side-col">
        <div class="panel" data-aos="fade-left" data-aos-delay="250">
            <div class="section-label">Game</div>
            <div id="status" class="status">Loading Kestrel</div>
            <div class="button-row">
                <button id="undo" class="kst-btn kst-btn-secondary">Undo</button>
                <button id="flip" class="kst-btn kst-btn-secondary">Flip</button>
                <button id="resign" class="kst-btn kst-btn-secondary">Resign</button>
            </div>
        </div>

        <div class="panel" data-aos="fade-left" data-aos-delay="350">
            <div class="section-label">New game</div>
            <div class="field-label">Play as</div>
            <div class="segmented" id="color-choice">
                <button data-value="white">White</button>
                <button data-value="random">Random</button>
                <button data-value="black">Black</button>
            </div>
            <div class="field-label">Strength</div>
            <div class="segmented" id="depth-choice">
                <button data-value="instinct" title="Plays almost on instinct, barely looking ahead">Instinct</button>
                <button data-value="careful" title="Thinks for half a second a move">Careful</button>
                <button data-value="strong" title="Thinks for about two and a half seconds a move">Strong</button>
            </div>
            <button id="new-game" class="kst-btn kst-btn-primary wide">Start new game</button>
        </div>

        <div class="panel moves-panel" data-aos="fade-left" data-aos-delay="450">
            <div class="panel-head">
                <div class="section-label">Moves</div>
                <button id="copy-pgn" class="link-btn">copy PGN</button>
            </div>
            <ol id="moves" class="moves"></ol>
        </div>
    </aside>
</main>

<footer>
    <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <span>Kestrel - built by <a href="https://github.com/eande171">Eden Anderson</a>. Licensed under GNU AGPL v3. <span id="model-info"></span></span>
            <span>
                <a href="https://lichess.org/@/KestrelChess">Challenge it on Lichess</a>
                &nbsp;·&nbsp;
                <a href="https://github.com/eande171/kestrel">GitHub</a>
                &nbsp;·&nbsp;
                <a href="https://ko-fi.com/eande171">Support Me</a>
            </span>
        </div>
    </div>
</footer>

<script>
    if (window.AOS) AOS.init({ once: true, duration: 700 });
    else document.querySelectorAll('[data-aos]').forEach(e => e.removeAttribute('data-aos'));
</script>
<script src="app.js"></script>
</body>
</html>
